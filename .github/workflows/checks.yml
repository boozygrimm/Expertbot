name: Проверки

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    name: Python-тесты
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-test.txt

      - name: Установить зависимости
        run: python -m pip install --upgrade pip -r requirements.txt -r requirements-test.txt

      - name: Проверить синтаксис и импорты
        run: python -m compileall -q .

      - name: Прогнать тесты
        env:
          MONGO_URI: mongodb://localhost:27017
          TELEGRAM_TOKEN: 123456:TESTTOKEN
          PYTHON_DOTENV_DISABLED: '1'
          PYTHONPATH: .
        run: python -m pytest tests/ -q

  miniapp:
    name: Тесты мини-приложения RAID
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: miniapp_preview/package-lock.json

      - name: Установить зависимости
        run: npm ci --prefix miniapp_preview

      - name: Прогнать тесты
        run: npm test --prefix miniapp_preview
